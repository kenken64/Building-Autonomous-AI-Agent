<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentMart A2A Console</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#121821; --panel2:#0e141c; --line:#1e2733;
    --ink:#e6edf3; --dim:#8b99a8; --faint:#55636f;
    --hermes:#c084fc; --worker:#38bdf8; --ship:#34d399; --order:#fbbf24; --pay:#fb7185;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    /* Fluid type: one knob scales the whole console between phone and desktop. */
    --fs:clamp(16px, 1.05vw + 14px, 19px);
    --fs-sm:clamp(14px, 0.7vw + 12.5px, 16px);
    --fs-xs:clamp(13px, 0.5vw + 11.8px, 15px);
    --fs-code:clamp(13.5px, 0.6vw + 12px, 15.5px);
    --fs-h1:clamp(19px, 1.4vw + 16px, 24px);
    --fs-stat:clamp(19px, 1.2vw + 16px, 23px);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:var(--fs);line-height:1.55;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
       overflow-x:hidden}
  header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;
         align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel2)}
  h1{margin:0;font-size:var(--fs-h1);font-weight:600;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:var(--fs-xs);font-family:var(--mono)}
  .spacer{flex:1 1 auto}
  button{background:var(--panel);color:var(--ink);border:1px solid var(--line);
         border-radius:9px;padding:11px 17px;font-size:var(--fs-sm);font-family:inherit;
         cursor:pointer;min-height:46px;transition:border-color .15s,background .15s}
  button:hover{border-color:var(--worker);background:#16202b}
  button.primary{background:#0f2a24;border-color:#1f6f57;color:#9df0d0}
  button.primary:hover{background:#14362d;border-color:var(--ship)}
  button:disabled{opacity:.45;cursor:not-allowed}
  input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
       padding:11px 14px;color:var(--ink);font-size:var(--fs-sm);font-family:inherit;
       flex:1 1 300px;min-width:0;min-height:46px}
  input[type=text]:focus{outline:none;border-color:var(--worker)}
  main{padding:22px 20px;max-width:1340px;margin:0 auto}
  .empty{color:var(--dim);padding:56px 12px;text-align:center;font-size:var(--fs-sm)}

  /* flow: a row on desktop, a stack on phones — never a sideways scroll */
  .flow{background:var(--panel2);border:1px solid var(--line);border-radius:14px;
        padding:20px;margin-bottom:18px}
  .lane{display:flex;align-items:stretch;gap:9px;flex-wrap:wrap}
  .node{border:1px solid var(--line);border-radius:10px;padding:11px 15px;background:var(--panel);
        flex:1 1 128px;min-width:0;text-align:center;opacity:.34;
        transition:opacity .25s,border-color .25s,transform .25s}
  .node.on{opacity:1;transform:translateY(-1px)}
  .node .nm{font-size:var(--fs-sm);font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .node .ms{font-family:var(--mono);font-size:var(--fs-xs);color:var(--dim);margin-top:3px}
  .node.hermes.on{border-color:var(--hermes);box-shadow:0 0 0 1px #c084fc22}
  .node.worker.on{border-color:var(--worker);box-shadow:0 0 0 1px #38bdf822}
  .node.ship.on{border-color:var(--ship);box-shadow:0 0 0 1px #34d39922}
  .node.order.on{border-color:var(--order);box-shadow:0 0 0 1px #fbbf2422}
  .node.pay.on{border-color:var(--pay);box-shadow:0 0 0 1px #fb718522}
  .arrow{color:var(--faint);font-size:var(--fs);align-self:center;flex:0 0 auto}

  .bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#0a0e13;margin-top:8px}
  .bar i{display:block;height:100%}
  .cached{background:var(--ship)} .fresh{background:var(--worker)}
  .out{background:var(--order)} .think{background:var(--hermes)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--dim);font-size:var(--fs-xs);margin-top:14px}
  .legend span{display:flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:0 0 auto}

  .run{background:var(--panel2);border:1px solid var(--line);border-radius:14px;
       margin-bottom:15px;overflow:hidden}
  .run > summary{padding:15px 18px;cursor:pointer;display:flex;align-items:center;
        gap:11px;flex-wrap:wrap;list-style:none}
  .run > summary::-webkit-details-marker{display:none}
  .pill{font-family:var(--mono);font-size:var(--fs-xs);padding:4px 11px;border-radius:6px;
        border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .pill.intent{color:var(--worker);border-color:#1e3a4d}
  .pill.time{color:var(--ink)}
  .pill.cached{color:var(--ship);border-color:#1f5f4a}
  .msg{flex:1 1 100%;color:var(--ink);font-size:var(--fs-sm);
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .hops{border-top:1px solid var(--line)}
  .hop{border-bottom:1px solid var(--line)}
  .hop:last-child{border-bottom:none}
  .hop > summary{padding:13px 18px;cursor:pointer;display:flex;align-items:center;
        gap:12px;flex-wrap:wrap;list-style:none}
  .hop > summary::-webkit-details-marker{display:none}
  .hop .agent{font-family:var(--mono);font-size:var(--fs-sm);font-weight:600;flex:0 0 auto}
  .hop .num{font-family:var(--mono);font-size:var(--fs-xs);color:var(--dim);flex:0 0 auto}
  .grow{flex:1 1 140px;min-width:120px}
  .io{padding:0 18px 17px}
  .io h4{margin:16px 0 7px;font-size:var(--fs-xs);text-transform:uppercase;
         letter-spacing:.9px;color:var(--faint);font-weight:600}
  pre{margin:0;background:#080c11;border:1px solid var(--line);border-radius:9px;
      padding:14px 16px;font-family:var(--mono);font-size:var(--fs-code);line-height:1.6;
      color:#c9d5e1;max-height:60vh;overflow:auto;white-space:pre-wrap;
      word-break:break-word;overflow-wrap:anywhere;-webkit-overflow-scrolling:touch}
  .totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:16px;
          padding:16px 18px;border-top:1px solid var(--line);background:#0c1119}
  .stat .k{font-size:var(--fs-xs);color:var(--faint);text-transform:uppercase;letter-spacing:.8px}
  .stat .v{font-family:var(--mono);font-size:var(--fs-stat);margin-top:3px}

  /* order board */
  .board{background:var(--panel2);border:1px solid var(--line);border-radius:14px;
         padding:18px;margin-bottom:18px}
  .board h2{margin:0 0 14px;font-size:var(--fs-sm);font-weight:600;color:var(--dim);
            text-transform:uppercase;letter-spacing:.9px;display:flex;
            align-items:center;gap:10px;flex-wrap:wrap}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .col{background:#0a0f16;border:1px solid var(--line);border-radius:11px;padding:12px;min-width:0}
  .col > .h{font-size:var(--fs-xs);font-family:var(--mono);color:var(--dim);
            margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}
  .card{background:var(--panel);border:1px solid var(--line);border-left-width:3px;
        border-radius:9px;padding:11px 13px;margin-bottom:9px}
  .card:last-child{margin-bottom:0}
  .card .oid{font-family:var(--mono);font-size:var(--fs-xs);font-weight:600;
             overflow:hidden;text-overflow:ellipsis}
  .card .meta{font-size:var(--fs-xs);color:var(--dim);margin-top:5px;line-height:1.5}
  .card .amt{font-family:var(--mono)}
  .s-awaiting_payment{border-left-color:var(--order)}
  .s-paid{border-left-color:var(--ship)}
  .s-packed{border-left-color:var(--worker)}
  .s-in_transit{border-left-color:var(--hermes)}
  .s-delivered{border-left-color:#4b5563}
  .s-cancelled{border-left-color:var(--pay)}
  .flash{animation:flash 1.6s ease-out}
  @keyframes flash{0%{box-shadow:0 0 0 2px var(--ship)}100%{box-shadow:0 0 0 0 transparent}}

  /* phones: stack the flow vertically and let every row breathe */
  @media (max-width:720px){
    header{padding:14px 16px;gap:10px}
    main{padding:16px 14px}
    .flow{padding:16px;border-radius:12px}
    .lane{flex-direction:column;align-items:stretch}
    .node{flex:0 0 auto;width:100%;text-align:left;display:flex;
          align-items:baseline;justify-content:space-between;gap:12px}
    .node .ms{margin-top:0}
    .arrow{transform:rotate(90deg);margin:-2px 0}
    #q{flex:1 1 100%;order:3}
    #send,#ship{flex:1 1 calc(50% - 6px);order:4}
    .hop > summary{gap:9px}
    .hop .agent{flex:1 1 100%}
    .grow{flex:1 1 100%;min-width:0}
    pre{max-height:52vh}
  }
  @media (max-width:420px){
    #send,#ship{flex:1 1 100%}
    .totals{grid-template-columns:repeat(2,1fr)}
    .cols{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header>
  <h1>AgentMart <span style="color:var(--dim);font-weight:400">A2A Console</span></h1>
  <span class="sub" id="mode">…</span>
  <span class="spacer"></span>
  <input type="text" id="q" placeholder="Ask AgentMart…"
         value="Find me wireless earbuds under $120 with good battery life.">
  <button id="send">Send</button>
  <button id="ship" class="primary">↻ Update shipping date</button>
</header>
<main>
  <div id="flow" class="flow"></div>
  <div id="board" class="board"></div>
  <div id="runs"></div>
</main>
<script>
const AGENTS = [
  ["hermes_myshopper","Hermes","hermes"],
  ["shopping_agent","Shopping","worker"],
  ["pricing_agent","Pricing","worker"],
  ["inventory_agent","Inventory","worker"],
  ["fulfillment_agent","Fulfillment","worker"],
  ["batched_workers","Batched","worker"],
  ["shipping_agent","Shipping","ship"],
  ["order_agent","Order","order"],
  ["payment_agent","Payment","pay"],
];
const esc = s => (s||"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const n = x => (x||0).toLocaleString();

function drawFlow(run){
  const active = new Map((run?.hops||[]).map(h => [h.agent, h.seconds]));
  const lane = AGENTS
    .filter(([id]) => id !== "batched_workers" || active.has("batched_workers"))
    .filter(([id]) => !(id === "batched_workers" && !active.has(id)))
    .map(([id,label,cls]) => {
      const on = active.has(id);
      return `<div class="node ${cls} ${on?"on":""}">
                <div class="nm">${label}</div>
                <div class="ms">${on ? active.get(id).toFixed(1)+"s" : "—"}</div>
              </div>`;
    }).join(`<span class="arrow">→</span>`);
  document.getElementById("flow").innerHTML =
    `<div class="lane">${lane}</div>
     <div class="legend">
       <span><i class="dot fresh"></i>prompt (fresh)</span>
       <span><i class="dot cached"></i>prompt (cached)</span>
       <span><i class="dot out"></i>completion</span>
       <span><i class="dot think"></i>reasoning</span>
     </div>`;
}

function hopRow(h){
  const fresh = Math.max(0, h.prompt_tokens - h.cached_tokens);
  const total = Math.max(1, h.prompt_tokens + h.completion_tokens);
  const pc = v => (100*v/total).toFixed(1)+"%";
  return `<details class="hop">
    <summary>
      <span class="agent">${esc(h.agent)}</span>
      <span class="num">${h.seconds.toFixed(1)}s</span>
      <span class="num">${n(h.prompt_tokens)} in · ${n(h.completion_tokens)} out${h.cached_tokens?` · ${n(h.cached_tokens)} cached`:""}</span>
      <span class="grow">
        <span class="bar">
          <i class="cached" style="width:${pc(h.cached_tokens)}"></i>
          <i class="fresh" style="width:${pc(fresh)}"></i>
          <i class="think" style="width:${pc(h.reasoning_tokens)}"></i>
          <i class="out" style="width:${pc(Math.max(0,h.completion_tokens-h.reasoning_tokens))}"></i>
        </span>
      </span>
      <span class="num">${esc(h.model)}</span>
    </summary>
    <div class="io">
      <h4>System prompt</h4><pre>${esc(h.system_prompt)}</pre>
      <h4>User prompt</h4><pre>${esc(h.user_prompt)}</pre>
      <h4>Response</h4><pre>${esc(h.response)}</pre>
    </div>
  </details>`;
}

function render(data){
  document.getElementById("mode").textContent =
    `workers ${data.batching?"batched":"per-agent"} · cache ${data.cache?"on":"off"}`;
  drawFlow(data.runs[0]);
  const el = document.getElementById("runs");
  if(!data.runs.length){
    el.innerHTML = `<div class="empty">No runs yet — send a question above, or use ↻ Update shipping date.</div>`;
    return;
  }
  el.innerHTML = data.runs.map((r,i) => `
    <details class="run" ${i===0?"open":""}>
      <summary>
        <span class="pill intent">${esc(r.intent)}</span>
        <span class="pill time">${r.seconds.toFixed(1)}s</span>
        <span class="pill">${r.hops.length} hop${r.hops.length===1?"":"s"}</span>
        ${r.cached?'<span class="pill cached">cached</span>':""}
        <span class="msg">${esc(r.message)}</span>
        <span class="pill">${r.at.slice(11,19)}</span>
      </summary>
      <div class="hops">${r.hops.map(hopRow).join("")}</div>
      <div class="totals">
        <div class="stat"><div class="k">prompt</div><div class="v">${n(r.totals.prompt_tokens)}</div></div>
        <div class="stat"><div class="k">cached</div><div class="v" style="color:var(--ship)">${n(r.totals.cached_tokens)}</div></div>
        <div class="stat"><div class="k">completion</div><div class="v" style="color:var(--order)">${n(r.totals.completion_tokens)}</div></div>
        <div class="stat"><div class="k">reasoning</div><div class="v" style="color:var(--hermes)">${n(r.totals.reasoning_tokens)}</div></div>
        <div class="stat"><div class="k">total</div><div class="v">${n(r.totals.prompt_tokens + r.totals.completion_tokens)}</div></div>
      </div>
    </details>`).join("");
}

const STATES = ["awaiting_payment","paid","packed","in_transit","delivered","cancelled"];
let seenOrders = {};

function drawBoard(orders){
  const by = Object.fromEntries(STATES.map(s => [s, []]));
  orders.forEach(o => (by[o.status] || (by[o.status] = [])).push(o));
  const total = orders.length;
  const cols = STATES.filter(s => by[s] && by[s].length).map(s => `
    <div class="col">
      <div class="h"><span>${s.replace(/_/g," ")}</span><span>${by[s].length}</span></div>
      ${by[s].map(o => {
        const moved = seenOrders[o.order_id] && seenOrders[o.order_id] !== o.status;
        const isNew = total && !(o.order_id in seenOrders);
        return `<div class="card s-${o.status} ${moved||isNew?"flash":""}">
          <div class="oid">${esc(o.order_id)}</div>
          <div class="meta">
            <span class="amt">$${o.total_usd.toFixed(2)}</span>
            ${o.paid_usd>0?` · paid <span class="amt">$${o.paid_usd.toFixed(2)}</span>`:" · unpaid"}<br>
            ${esc(o.customer_id)} · ${esc(o.items.join(", "))}
            ${o.eta_date?`<br>eta ${esc(o.eta_date)}`:""}
            ${o.tracking?`<br>${esc(o.tracking)}`:""}
          </div>
        </div>`;
      }).join("")}
    </div>`).join("");
  document.getElementById("board").innerHTML =
    `<h2>Order book <span class="pill">${total} orders</span>
       <span class="pill">live</span></h2>
     <div class="cols">${cols || '<div class="empty">Order book is empty — run seed_data.py</div>'}</div>`;
  seenOrders = Object.fromEntries(orders.map(o => [o.order_id, o.status]));
}

async function loadBoard(){
  try{ drawBoard((await (await fetch("/console/orders")).json()).orders); }
  catch(e){ /* board is secondary; a failed poll must not blank the runs */ }
}

async function load(){
  try{ render(await (await fetch("/console/data")).json()); }
  catch(e){ document.getElementById("runs").innerHTML =
    `<div class="empty">Server unreachable — is a2a_server.py running?</div>`; }
}

async function ask(text, btn){
  const prev = btn.textContent;
  btn.disabled = true; btn.textContent = "running…";
  try{
    await fetch("/", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({jsonrpc:"2.0", id:"console", method:"SendMessage",
        params:{message:{role:"ROLE_USER", parts:[{text}]}}})});
  } finally {
    btn.disabled = false; btn.textContent = prev; load(); loadBoard();
  }
}

document.getElementById("send").onclick = e =>
  ask(document.getElementById("q").value, e.target);
document.getElementById("q").addEventListener("keydown", e => {
  if(e.key === "Enter") document.getElementById("send").click();
});
document.getElementById("ship").onclick = e =>
  ask("When will my order AM-ORD-20260912-0002 arrive? Give me the updated shipping date.", e.target);

load(); loadBoard();
setInterval(() => { load(); loadBoard(); }, 4000);
</script>
</body>
</html>
